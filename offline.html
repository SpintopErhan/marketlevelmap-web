<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#10161d"><title>MarketLevelMap — Offline</title><link rel="icon" href="/assets/icons/icon-192.png">
<style>
:root{color-scheme:dark;--bg:#10161d;--fg:#edf2f4;--muted:#9aaab5;--line:#28343d;--accent:#4fd6c3;--panel:#151e27}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f6f4;--fg:#182d36;--muted:#405a66;--line:#cad7d3;--accent:#087a6c;--panel:#fff}
@media(prefers-color-scheme:light){:root:not([data-theme]){color-scheme:light;--bg:#f4f6f4;--fg:#182d36;--muted:#405a66;--line:#cad7d3;--accent:#087a6c;--panel:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:var(--bg);color:var(--fg);font-family:Inter,"Segoe UI",Arial,sans-serif;text-align:center}
main{max-width:420px;padding:32px 28px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
img{width:64px;height:64px;border-radius:14px}
h1{margin:18px 0 8px;font-size:20px}p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}
button{border:1px solid var(--accent);border-radius:999px;background:none;color:var(--accent);font:inherit;font-size:14px;font-weight:600;padding:9px 20px;cursor:pointer}
</style>
<script>try{var t=localStorage.getItem("mlm-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head><body><main><img src="/assets/icons/icon-192.png" alt="MarketLevelMap"><h1 id="title">You are offline</h1><p id="text">This page has not been saved for offline use. Market prices and analyses need a connection; please try again when you are back online.</p><button id="retry" type="button">Try again</button></main>
<script>
(function(){
  var lang="en";try{lang=localStorage.getItem("mlm-lang")==="tr"?"tr":"en"}catch(e){}
  if(lang==="tr"){document.documentElement.lang="tr";document.title="MarketLevelMap — Çevrimdışı";
    document.getElementById("title").textContent="Çevrimdışısınız";
    document.getElementById("text").textContent="Bu sayfa çevrimdışı kullanım için kaydedilmemiş. Piyasa fiyatları ve analizler için bağlantı gerekir; bağlantınız geri geldiğinde tekrar deneyin.";
    document.getElementById("retry").textContent="Tekrar dene"}
  document.getElementById("retry").addEventListener("click",function(){location.reload()});
  window.addEventListener("online",function(){location.reload()});
})();
</script></body></html>
