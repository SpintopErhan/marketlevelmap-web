tr:
  slug: ikili-dip
  name: İkili Dip
  alt_name: Double Bottom
  summary: >-
    Bir düşüşün sonunda, fiyatın yaklaşık aynı seviyede iki dip yapmasıyla oluşan dönüş
    formasyonu. İki dip arasındaki tepeden geçen boyun çizgisinin üzerine çıkılmasıyla tamamlanır.
    Fiyatın aynı seviyenin altına ikinci kez inemediğini ve düşüşün güç kaybettiğini gösterebilir.
  formation:
    style: steps
    items:
      - title: Önceki düşüş.
        text: Formasyon bir dönüş işaretidir. Öncesinde belirgin bir düşüş trendi olmalıdır.
      - title: Birinci dip.
        text: Fiyat yeni bir dip yapar, ardından belirgin bir toparlanmayla bir tepeye çıkar.
      - title: Aradaki tepe.
        text: >-
          Toparlanma küçük bir dalgalanma değil, görünür bir harekettir. Günlük grafiklerde sık
          verilen ölçü, dipten yaklaşık **%10 ya da daha fazla** yükseliştir. Küçük zaman
          dilimlerinde bu oran daha düşük olabilir.
      - title: İkinci dip.
        text: >-
          Fiyat yeniden geriler ve ilk dibe yakın bir seviyede durur. İki dip arasındaki fark
          genellikle **yaklaşık %3'ün altındadır**. Dipler birkaç mumluk aralıkla değil, belirgin
          bir süreyle ayrılır.
      - title: Boyun çizgisi.
        text: İki dip arasındaki tepenin en yüksek noktasından geçen yatay çizgidir.
      - title: Tamamlanma.
        text: Fiyat boyun çizgisinin üzerinde **kapanış** yaptığında formasyon tamamlanmış sayılır. O ana kadar iki dip yalnızca bir olasılıktır.
    note: Oranlar yaklaşıktır. Ders kitaplarında yaygın kabul gören değerlerdir, kesin sınırlar değildir.
  meaning:
    - >-
      İlk dipte alıcılar fiyatı yukarı iter. İkinci düşüşte fiyat aynı seviyeye gelir ama altına
      inemez. Bu, o seviyede alım ilgisinin sürdüğünü ve satıcıların yeni bir dip yapacak gücü
      bulamadığını gösterebilir. Aradaki tepenin aşılması ise satıcıların son savunma seviyesinin
      de geçildiğine işaret eder.
    - >-
      Düşüşlerde fiyatın bir önceki dibe geri gelip tepki vermesi çok sık görülür. Bu tek başına
      ikili dip değildir. Formasyon ancak boyun çizgisi yukarı kırıldığında anlam kazanır.
      Kırılım gelmeden fiyat diplerin altına inebilir ve düşüş devam edebilir.
  measurement:
    title: Sık kullanılan bir ölçüm
    text: >-
      Teknik analizde diplerin boyun çizgisine olan derinliği (h), kırılım noktasından yukarı
      doğru ölçülerek olası hareketin büyüklüğü hakkında kaba bir fikir verilir. Bu bir hedef
      değil, bir ölçek referansıdır. Fiyat bu mesafeye ulaşmadan dönebilir ya da çok daha ileri
      gidebilir. Yoldaki direnç bölgeleri genellikle daha gerçekçi bir referanstır.
  strengthens:
    - İki dibin de aynı destek bölgesinde oluşması
    - İkinci dipte satış hacminin birinci dibe göre düşük kalması
    - Boyun çizgisi kırılırken hacmin belirgin şekilde artması
    - Dipler arasında belirgin bir süre ve güçlü bir toparlanma olması
    - Üst zaman diliminde (4H, 1D) oluşması
  weakens:
    - Öncesinde belirgin bir düşüş olmaması
    - Diplerin çok kısa aralıkla oluşması
    - Aradaki tepenin çok alçak olması
    - Kırılımın düşük hacimle gelmesi
    - Boyun çizgisinin hemen üzerinde güçlü bir direnç bölgesi bulunması
  zones:
    intro: "İkili dip, doğası gereği bir bölge formasyonudur: fiyat aynı alana iki kez iner ve iki kez yukarı döner. Bölgelerle ilişkisi üç yerde okunur:"
    points:
      - "**İki dip bir destek bölgesine denk geliyorsa**, formasyon o bölgenin ikinci kez savunulduğunu gösterir. Diplerin tam aynı fiyatta olması gerekmez, ikisinin de aynı bölgenin içinde kalması yeterlidir."
      - "**Aradaki tepe bir direnç bölgesiyle örtüşüyorsa**, boyun çizgisinin aşılması o bölgenin de geçildiği anlamına gelir. Bu, kırılımı daha anlamlı kılar."
      - "**Kırılımın üzerindeki ilk direnç bölgesi**, fiyatın nerede yeniden tepki verebileceğine dair ölçüm yönteminden daha gerçekçi bir referanstır."
    paragraphs:
      - >-
        Kırılımdan sonra fiyat bazen boyun çizgisine geri inip onu yukarıdan test eder. Daha önce
        direnç olan bölge bu kez destek gibi davranabilir. Fiyat bu testte boyun çizgisinin
        altında kapanış yapıp orada kalırsa kırılım zayıflamış kabul edilir.
  completion: Boyun çizgisinin (aradaki tepenin) üzerinde kapanış.
  invalidation:
    before: >-
      Fiyat boyun çizgisini kırmadan iki dibin altında kapanış yaparsa formasyon oluşmamış
      kabul edilir. Bu durumda dipler bir destek değil, kaybedilen bir seviye olur.
    after: >-
      Boyun çizgisinin üzerinde kapanış gelmiş olsa bile fiyat yeniden boyun çizgisinin altına
      iner ve **ikinci dibin altında kapanış** yaparsa yükseliş senaryosu geçersiz sayılır.
  confusions:
    - id: inverse-head-and-shoulders
      text: "Ortada daha derin bir dip (baş) ve iki yanında omuzlar vardır."
    - id: triple-bottom
      text: Aynı seviyede iki değil üç dip oluşur.
    - id: rectangle
      text: Fiyat iki yatay seviye arasında gidip gelir, kırılımın yönü önceden belli değildir.
  facts:
    - [Tür, Dönüş]
    - [Yön, Yükseliş]
    - [Süre, Çok mumlu]
    - [Bağlam, Düşüş sonrası]
    - [Tamamlanma, Aradaki tepenin üstünde kapanış]
    - [Geçersiz, İkinci dip altında kapanış]
  svg_labels:
    neckline: Boyun çizgisi
    bottom_1: 1. dip
    bottom_2: 2. dip
    breakout: Kırılım
  svg_alt: "İkili dip çizimi: düşen fiyat bir dip yapıyor, bir tepeye toparlanıyor, ilk dibe yakın seviyede ikinci bir dip yapıyor ve ardından aradaki tepeden geçen boyun çizgisinin üzerine çıkıyor"
  svg_caption: Turuncu nokta, boyun çizgisini belirleyen aradaki tepeyi gösterir. h, diplerin boyun çizgisine olan derinliğidir.

en:
  slug: double-bottom
  name: Double Bottom
  alt_name: İkili Dip
  summary: >-
    A reversal pattern that forms at the end of a downtrend, when price makes two troughs at
    roughly the same level. It completes when price rises above the neckline drawn through the peak
    between the troughs. It can signal that price failed to break below the same level twice and
    that the downtrend is losing strength.
  formation:
    style: steps
    items:
      - title: Prior downtrend.
        text: The pattern is a reversal signal. It needs a clear downtrend before it.
      - title: First trough.
        text: Price makes a new low, then recovers clearly to a peak.
      - title: The peak between.
        text: >-
          The recovery is a visible move, not a small wobble. A figure often quoted for daily charts
          is a rise of about **10% or more** from the trough. On lower timeframes it can be smaller.
      - title: Second trough.
        text: >-
          Price falls again and stops near the first trough. The two troughs are usually **within
          about 3%** of each other. They are separated by a clear stretch of time, not just a few
          candles.
      - title: Neckline.
        text: A horizontal line through the highest point of the peak between the troughs.
      - title: Completion.
        text: The pattern is complete when price **closes** above the neckline. Until then, two troughs are only a possibility.
    note: The figures are approximate. They are commonly accepted textbook values, not hard limits.
  meaning:
    - >-
      At the first trough, buyers push price back up. On the second drop, price reaches the same
      level but cannot get below it. This can show that buying interest is still there and that
      sellers lack the strength for a new low. A break above the peak suggests that sellers' last
      line of defence has been cleared.
    - >-
      In a downtrend, price often returns to a previous low and bounces. That alone is not a double
      bottom. The pattern only means something once the neckline breaks upwards. Before that, price
      can fall below the troughs and the downtrend can carry on.
  measurement:
    title: A common measurement
    text: >-
      In technical analysis, the depth of the troughs below the neckline (h) is measured up from the
      breakout point to give a rough sense of the possible move's size. It is a scale reference, not
      a target. Price can turn before covering that distance, or go much further. Resistance zones
      along the way are usually a more realistic reference.
  strengthens:
    - Both troughs forming in the same support zone
    - Lower selling volume on the second trough than on the first
    - A clear rise in volume as the neckline breaks
    - A clear gap in time and a strong recovery between the troughs
    - Forming on a higher timeframe (4H, 1D)
  weakens:
    - No clear downtrend before the pattern
    - Troughs forming very close together in time
    - A very low peak between the troughs
    - The break coming on low volume
    - A strong resistance zone just above the neckline
  zones:
    intro: "A double bottom is a zone pattern by nature: price drops to the same area twice and turns up twice. Its link to zones is read in three places:"
    points:
      - "**If both troughs fall in a support zone**, the pattern shows that zone being defended a second time. The troughs need not be at exactly the same price; it is enough that both sit inside the same zone."
      - "**If the peak between them lines up with a resistance zone**, a break of the neckline also means that zone is cleared. This gives the break more weight."
      - "**The first resistance zone above the break** is a more realistic reference than the measured move for where price may react again."
    paragraphs:
      - >-
        After the break, price sometimes returns to retest the neckline from above. The zone that was
        resistance may now act as support. If price closes back below the neckline in this test and
        stays there, the break is considered to have weakened.
  completion: Close above the neckline (the peak between the troughs).
  invalidation:
    before: >-
      If price closes below both troughs without breaking the neckline, the pattern is considered
      not to have formed. The troughs then become a level that has been lost, not support.
    after: >-
      Even after a close above the neckline, if price drops back below it and **closes below the
      second trough**, the bullish scenario is considered invalid.
  confusions:
    - id: inverse-head-and-shoulders
      text: There is a deeper middle trough (the head) with a shoulder on each side.
    - id: triple-bottom
      text: Three troughs form at the same level instead of two.
    - id: rectangle
      text: Price moves between two flat levels, and the direction of the break is not known in advance.
  facts:
    - [Type, Reversal]
    - [Direction, Bullish]
    - [Duration, Multi-candle]
    - [Context, After a downtrend]
    - [Completion, Close above the peak]
    - [Invalid, Close below the second trough]
  svg_labels:
    neckline: Neckline
    bottom_1: Trough 1
    bottom_2: Trough 2
    breakout: Breakout
  svg_alt: "Double bottom illustration: falling price makes a trough, recovers to a peak, makes a second trough near the first, then rises above the neckline through the peak"
  svg_caption: The orange dot marks the peak that defines the neckline. h is the depth of the troughs below the neckline.
