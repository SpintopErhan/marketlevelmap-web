tr:
  slug: uclu-dip
  name: Üçlü Dip
  alt_name: Triple Bottom
  summary: >-
    Bir düşüşün sonunda, fiyatın yaklaşık aynı seviyede üç dip yapmasıyla oluşan dönüş
    formasyonu. Dipler arasındaki iki tepeden geçen boyun çizgisinin üzerine çıkılmasıyla
    tamamlanır. Fiyatın aynı seviyenin altına üç kez inemediğini ve düşüşün güç kaybettiğini
    gösterebilir.
  formation:
    style: steps
    items:
      - title: Önceki düşüş.
        text: Formasyon bir dönüş işaretidir. Öncesinde belirgin bir düşüş trendi olmalıdır.
      - title: Birinci dip ve ilk tepe.
        text: >-
          Fiyat yeni bir dip yapar, ardından görünür bir toparlanmayla bir tepeye çıkar. Günlük
          grafiklerde sık verilen ölçü, dipten yaklaşık **%10 ya da daha fazla** yükseliştir. Küçük
          zaman dilimlerinde bu oran daha düşük olabilir.
      - title: İkinci dip ve ikinci tepe.
        text: >-
          Fiyat yeniden geriler, ilk dibe yakın bir seviyede durur ve tekrar toparlanır. İkinci
          tepe çoğu zaman ilk tepeye yakın bir seviyede biter.
      - title: Üçüncü dip.
        text: >-
          Fiyat üçüncü kez aynı seviyeye iner ama altına geçemez. Üç dip arasındaki fark genellikle
          **yaklaşık %3'ün altındadır**. Dipler birkaç mumluk aralıkla değil, belirgin bir süreyle
          ayrılır.
      - title: Boyun çizgisi.
        text: >-
          İki tepeyi birleştiren çizgidir. Tepeler aynı seviyede değilse çoğu zaman daha yüksek
          olan tepeden geçen yatay çizgi esas alınır.
      - title: Tamamlanma.
        text: Fiyat boyun çizgisinin üzerinde **kapanış** yaptığında formasyon tamamlanmış sayılır. O ana kadar üç dip yalnızca bir olasılıktır.
    note: Oranlar yaklaşıktır. Ders kitaplarında yaygın kabul gören değerlerdir, kesin sınırlar değildir.
  meaning:
    - >-
      Alıcılar fiyatı aynı seviyeden üç kez yukarı iter. Her denemede satıcılar o seviyeye kadar
      iner ama altına geçecek gücü bulamaz. Bu, o seviyede alım ilgisinin sürdüğünü ve düşüşün
      yorulduğunu gösterebilir. İki tepeden geçen boyun çizgisinin aşılması ise satıcıların iki
      kez savunduğu seviyenin de geçildiğine işaret eder.
    - >-
      Üç dip, kırılım gelene kadar bir yatay aralıktan ayırt edilemez. Fiyat iki yatay seviye
      arasında gidip gelirken formasyonun yönü belli değildir. Boyun çizgisi kırılmadan fiyat
      diplerin altına inebilir ve düşüş devam edebilir.
  measurement:
    title: Sık kullanılan bir ölçüm
    text: >-
      Teknik analizde diplerin boyun çizgisine olan derinliği (h), kırılım noktasından yukarı
      doğru ölçülerek olası hareketin büyüklüğü hakkında kaba bir fikir verilir. Bu bir hedef
      değil, bir ölçek referansıdır. Fiyat bu mesafeye ulaşmadan dönebilir ya da çok daha ileri
      gidebilir. Yoldaki direnç bölgeleri genellikle daha gerçekçi bir referanstır.
  strengthens:
    - Üç dibin de aynı destek bölgesinde oluşması
    - Satış hacminin her dipte bir öncekine göre düşük kalması
    - Boyun çizgisi kırılırken hacmin belirgin şekilde artması
    - İki tepenin de yaklaşık aynı seviyede olması
    - Üst zaman diliminde (4H, 1D) oluşması
  weakens:
    - Öncesinde belirgin bir düşüş olmaması
    - Diplerin çok kısa aralıkla oluşması
    - Aradaki tepelerin çok alçak olması
    - Kırılımın düşük hacimle gelmesi
    - Boyun çizgisinin hemen üzerinde güçlü bir direnç bölgesi bulunması
  zones:
    intro: "Üçlü dip, aynı destek bölgesinin üç kez test edilmesidir. Bölgelerle ilişkisi üç yerde okunur:"
    points:
      - "**Üç dip bir destek bölgesine denk geliyorsa**, formasyon o bölgenin üç kez savunulduğunu gösterir. Diplerin tam aynı fiyatta olması gerekmez, üçünün de aynı bölgenin içinde kalması yeterlidir. Diplerden biri bölgenin alt sınırını fitille aşıp içeride kapanıyorsa bu da bir savunma sayılabilir."
      - "**İki tepe bir direnç bölgesiyle örtüşüyorsa**, boyun çizgisi aslında bir çizgi değil, iki kez geri dönülmüş bir direnç bölgesidir. Kırılım ancak fiyat bu bölgenin üzerinde kapanış yaptığında anlam kazanır."
      - "**Kırılımın üzerindeki ilk direnç bölgesi**, fiyatın nerede yeniden tepki verebileceğine dair ölçüm yönteminden daha gerçekçi bir referanstır."
    paragraphs:
      - >-
        Kırılımdan sonra fiyat bazen boyun çizgisine geri inip onu yukarıdan test eder. Daha önce
        direnç olan bölge bu kez destek gibi davranabilir. Fiyat bu testte boyun çizgisinin
        altında kapanış yapıp orada kalırsa kırılım zayıflamış kabul edilir.
  completion: Boyun çizgisinin (iki tepenin) üzerinde kapanış.
  invalidation:
    before: >-
      Fiyat boyun çizgisini kırmadan üç dibin altında kapanış yaparsa formasyon oluşmamış
      kabul edilir. Bu durumda dipler bir destek değil, kaybedilen bir seviye olur.
    after: >-
      Boyun çizgisinin üzerinde kapanış gelmiş olsa bile fiyat yeniden boyun çizgisinin altına
      iner ve **üçüncü dibin altında kapanış** yaparsa yükseliş senaryosu geçersiz sayılır.
  confusions:
    - id: double-bottom
      text: Aynı seviyede üç değil iki dip oluşur, aralarında tek bir tepe vardır.
    - id: inverse-head-and-shoulders
      text: "Ortadaki dip (baş) iki yanındakilerden belirgin şekilde derindir."
    - id: rectangle
      text: Üst ve alt sınır aynı olabilir, ama kırılım gelmeden yön belli değildir ve fiyat aşağı da inebilir.
  facts:
    - [Tür, Dönüş]
    - [Yön, Yükseliş]
    - [Süre, Çok mumlu]
    - [Bağlam, Düşüş sonrası]
    - [Tamamlanma, İki tepenin üstünde kapanış]
    - [Geçersiz, Üçüncü dip altında kapanış]
  svg_labels:
    neckline: Boyun çizgisi
    bottom_1: 1. dip
    bottom_2: 2. dip
    bottom_3: 3. dip
    breakout: Kırılım
  svg_alt: "Üçlü dip çizimi: düşen fiyat aynı seviyede üç dip yapıyor, aralarında yaklaşık aynı seviyede iki tepeye toparlanıyor ve ardından iki tepeden geçen boyun çizgisinin üzerine çıkıyor"
  svg_caption: Turuncu noktalar, boyun çizgisini belirleyen iki tepeyi gösterir. h, diplerin boyun çizgisine olan derinliğidir.

en:
  slug: triple-bottom
  name: Triple Bottom
  summary: >-
    A reversal pattern that forms at the end of a downtrend, when price makes three troughs at
    roughly the same level. It completes when price rises above the neckline drawn through the two
    peaks between the troughs. It can signal that price failed to break below the same level three
    times and that the downtrend is losing strength.
  formation:
    style: steps
    items:
      - title: Prior downtrend.
        text: The pattern is a reversal signal. It needs a clear downtrend before it.
      - title: First trough and first peak.
        text: >-
          Price makes a new low, then recovers visibly to a peak. A figure often quoted for daily
          charts is a rise of about **10% or more** from the trough. On lower timeframes it can be
          smaller.
      - title: Second trough and second peak.
        text: >-
          Price falls again, stops near the first trough and recovers once more. The second peak
          often ends near the first.
      - title: Third trough.
        text: >-
          Price drops to the same level a third time but cannot get below it. The three troughs are
          usually **within about 3%** of each other. They are separated by a clear stretch of time,
          not just a few candles.
      - title: Neckline.
        text: >-
          A line joining the two peaks. If the peaks are not level, a horizontal line through the
          higher one is often used instead.
      - title: Completion.
        text: The pattern is complete when price **closes** above the neckline. Until then, three troughs are only a possibility.
    note: The figures are approximate. They are commonly accepted textbook values, not hard limits.
  meaning:
    - >-
      Buyers push price back up from the same level three times. Each time, sellers reach that level
      but lack the strength to get below it. This can show that buying interest is still there and
      that the downtrend is tiring. A break above the neckline through the two peaks suggests that
      the level sellers defended twice has also been cleared.
    - >-
      Until the break, three troughs cannot be told apart from a sideways range. While price moves
      between two flat levels, the direction of the pattern is not settled. Before the neckline
      breaks, price can fall below the troughs and the downtrend can carry on.
  measurement:
    title: A common measurement
    text: >-
      In technical analysis, the depth of the troughs below the neckline (h) is measured up from the
      breakout point to give a rough sense of the possible move's size. It is a scale reference, not
      a target. Price can turn before covering that distance, or go much further. Resistance zones
      along the way are usually a more realistic reference.
  strengthens:
    - All three troughs forming in the same support zone
    - Selling volume falling at each trough compared with the one before
    - A clear rise in volume as the neckline breaks
    - Both peaks sitting at roughly the same level
    - Forming on a higher timeframe (4H, 1D)
  weakens:
    - No clear downtrend before the pattern
    - Troughs forming very close together in time
    - Very low peaks between the troughs
    - The break coming on low volume
    - A strong resistance zone just above the neckline
  zones:
    intro: "A triple bottom is the same support zone being tested three times. Its link to zones is read in three places:"
    points:
      - "**If all three troughs fall in a support zone**, the pattern shows that zone being defended three times. The troughs need not be at exactly the same price; it is enough that all three sit inside the same zone. A trough whose wick pokes below the zone but closes back inside can also count as a defence."
      - "**If the two peaks line up with a resistance zone**, the neckline is really a resistance zone that has turned price back twice, not a single line. The break only means something once price closes above that zone."
      - "**The first resistance zone above the break** is a more realistic reference than the measured move for where price may react again."
    paragraphs:
      - >-
        After the break, price sometimes returns to retest the neckline from above. The zone that was
        resistance may now act as support. If price closes back below the neckline in this test and
        stays there, the break is considered to have weakened.
  completion: Close above the neckline (the two peaks).
  invalidation:
    before: >-
      If price closes below all three troughs without breaking the neckline, the pattern is
      considered not to have formed. The troughs then become a level that has been lost, not support.
    after: >-
      Even after a close above the neckline, if price drops back below it and **closes below the
      third trough**, the bullish scenario is considered invalid.
  confusions:
    - id: double-bottom
      text: Two troughs form at the same level instead of three, with a single peak between them.
    - id: inverse-head-and-shoulders
      text: The middle trough (the head) is clearly deeper than the ones on either side.
    - id: rectangle
      text: The top and bottom can be the same, but the direction is not known before the break and price can go down as well.
  facts:
    - [Type, Reversal]
    - [Direction, Bullish]
    - [Duration, Multi-candle]
    - [Context, After a downtrend]
    - [Completion, Close above the two peaks]
    - [Invalid, Close below the third trough]
  svg_labels:
    neckline: Neckline
    bottom_1: Trough 1
    bottom_2: Trough 2
    bottom_3: Trough 3
    breakout: Breakout
  svg_alt: "Triple bottom illustration: falling price makes three troughs at the same level, recovers to two peaks at roughly the same level between them, then rises above the neckline through the peaks"
  svg_caption: The orange dots mark the two peaks that define the neckline. h is the depth of the troughs below the neckline.
