    <rect x="188" y="150" width="62" height="20" rx="2"/>
    <rect x="188" y="190" width="47" height="20" rx="2"/>
    <rect x="188" y="230" width="22" height="20" rx="2"/>
    <rect x="188" y="270" width="19" height="20" rx="2"/>
  </g>
  <text class="t-accent t-mono" x="496" y="85">{{p_eur}}</text>
  <g class="t-label t-mono">
    <text x="267" y="125">{{p_jpy}}</text>
    <text x="258" y="165">{{p_gbp}}</text>
    <text x="243" y="205">{{p_cad}}</text>
    <text x="218" y="245">{{p_sek}}</text>
    <text x="215" y="285">{{p_chf}}</text>
  </g>
</svg>
