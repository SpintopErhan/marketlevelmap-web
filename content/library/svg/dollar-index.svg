<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <text class="t-label" x="24" y="40">{{title}}</text>
  <line class="s-guide" x1="188" y1="60" x2="188" y2="300" stroke-width="1.2"/>
  <g class="t-label" text-anchor="end">
    <text x="178" y="86">{{eur}}</text>
    <text x="178" y="126">{{jpy}}</text>
    <text x="178" y="166">{{gbp}}</text>
    <text x="178" y="206">{{cad}}</text>
    <text x="178" y="246">{{sek}}</text>
