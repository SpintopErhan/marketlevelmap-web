<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <line class="s-up" x1="160" y1="40" x2="160" y2="250" stroke-width="2.5"/>
  <rect class="f-up" x="134" y="94" width="52" height="102" rx="2"/>
  <line class="s-down" x1="400" y1="40" x2="400" y2="250" stroke-width="2.5"/>
  <rect class="f-down" x="374" y="94" width="52" height="102" rx="2"/>
  <g class="s-guide" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="40" x2="152" y2="40"/>
    <line x1="100" y1="196" x2="130" y2="196"/>
    <line x1="100" y1="250" x2="152" y2="250"/>
    <line x1="408" y1="40" x2="460" y2="40"/>
    <line x1="430" y1="94" x2="460" y2="94"/>
    <line x1="408" y1="250" x2="460" y2="250"/>
  </g>
  <g class="s-accent" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="94" x2="130" y2="94"/>
    <line x1="430" y1="196" x2="460" y2="196"/>
  </g>
  <circle class="f-accent" cx="186" cy="94" r="3.5"/>
  <circle class="f-accent" cx="426" cy="196" r="3.5"/>
  <g class="t-label" text-anchor="end">
    <text x="94" y="44">{{high}}</text>
    <text x="94" y="200">{{open}}</text>
    <text x="94" y="254">{{low}}</text>
  </g>
  <text class="t-accent" x="94" y="98" text-anchor="end">{{close}}</text>
  <g class="t-label">
