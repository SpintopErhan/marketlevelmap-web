    <text x="466" y="254">{{low}}</text>
  </g>
  <text class="t-accent" x="466" y="200">{{close}}</text>
  <path class="s-guide" d="M200 42 h8 M200 92 h8 M204 42 V92 M200 98 h8 M200 192 h8 M204 98 V192 M200 198 h8 M200 248 h8 M204 198 V248" stroke-width="1.2" fill="none"/>
  <g class="t-guide">
    <text x="216" y="71">{{upper_wick}}</text>
    <text x="216" y="149">{{body}}</text>
    <text x="216" y="227">{{lower_wick}}</text>
  </g>
  <g class="t-label" text-anchor="middle">
    <text x="160" y="284">{{up_1}}</text>
    <text x="160" y="300">{{up_2}}</text>
    <text x="400" y="284">{{down_1}}</text>
    <text x="400" y="300">{{down_2}}</text>
