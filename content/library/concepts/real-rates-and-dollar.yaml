tr:
  slug: reel-faiz-ve-dolar
  name: Reel faiz ve dolarla ilişki
  alt_name: Real rates and the dollar
  summary: >-
    Altın faiz ya da temettü ödemez. Bu yüzden altını tutmanın maliyeti, başka yerde kazanılabilecek
    getiriye, özellikle enflasyondan arındırılmış reel faize bağlıdır. Altın, reel faizle ve dolarla
    çoğu zaman ters yönde hareket etme eğilimi gösterir; ama bu ilişki bazı dönemlerde belirgin biçimde
    zayıflamıştır.
  sections:
    - type: text
      id: definition
      title: Reel faiz nedir?
      paragraphs:
        - >-
          **Reel faiz**, nominal faizden beklenen enflasyonun çıkarılmasıyla kabaca bulunur: reel faiz ≈
          nominal faiz − enflasyon beklentisi. Örneğin bir tahvil yüzde 4 getiri sağlıyor ve enflasyonun
          yüzde 2,5 olması bekleniyorsa, reel getiri yaklaşık yüzde 1,5'tir (örnek rakamlar).
        - >-
          Piyasada en sık izlenen ölçü, ABD Hazinesi'nin enflasyona endeksli tahvillerinin (TIPS)
          getirisidir. **10 yıllık TIPS getirisi**, 10 yıllık reel faizin piyasadaki karşılığı olarak
          kullanılır. Aynı vadeli normal tahvil getirisi ile TIPS getirisi arasındaki fark ise piyasanın
          enflasyon beklentisi olarak okunur (başabaş enflasyon).
    - type: text
      id: opportunity-cost
      title: Altın neden reel faize duyarlıdır?
      paragraphs:
        - >-
          Altın tutan biri faiz almaz. Aynı parayı tahvile yatıran ise getiri elde eder. Bu vazgeçilen
          getiriye **fırsat maliyeti** denir. Reel faiz yükseldiğinde altın tutmanın fırsat maliyeti
          artar; reel faiz düştüğünde, özellikle sıfırın altına indiğinde, bu maliyet azalır.
        - >-
          Burada nominal değil reel faiz önemlidir. Enflasyon yüksekken nominal faizin yükselmesi, reel
          faiz düşük kaldığı sürece altın açısından aynı anlamı taşımayabilir.
    - type: bullets
      id: tendencies
      title: Sık görülen eğilimler
      items:
        - text: Reel faiz **yükselirken** altın çoğu zaman baskı altında kalır; reel faiz **düşerken** altın desteklenme eğilimindedir.
          marker: neutral
        - text: Altın uluslararası piyasada dolar cinsinden fiyatlanır. Dolar güçlendiğinde altın diğer para birimlerini kullananlar için pahalılaşır; bu yüzden **güçlü dolar** altında çoğu zaman zayıflıkla birlikte görülür.
          marker: neutral
        - text: Reel faiz ve dolar çoğu zaman aynı yönde hareket eder; ikisi birlikte yükseldiğinde altın üzerindeki baskı daha belirgin olabilir.
          marker: neutral
        - text: Bu ilişkiler **eğilimdir**. Günlük ve haftalık hareketlerde sık sık bozulur; uzun dönemlerde daha net görünür.
          marker: accent
    - type: text
      id: when-it-breaks
      title: İlişkinin bozulduğu dönemler
      paragraphs:
        - >-
          Ters ilişki her zaman geçerli olmamıştır. 2022'den sonraki birkaç yılda reel faizler belirgin
          biçimde yükselirken altın zayıflamak yerine güçlü kalmıştır. Bu dönemde **merkez bankalarının
          güçlü altın alımları** sık gösterilen bir açıklamadır; jeopolitik belirsizlik ve rezervleri
          çeşitlendirme isteği de etkili görülmüştür.
        - >-
          Ani kriz anlarında da tablo değişebilir: güvenli liman talebiyle dolar ve altın **aynı anda**
          yükselebilir ya da nakit ihtiyacıyla her şeyle birlikte altın da satılabilir. Bu yüzden reel
          faiz ve dolar, altını açıklayan etkenlerden yalnızca ikisidir.
    - type: scenarios
      id: readings
      title: Aynı veride farklı tablolar
      intro: Reel faiz ve dolar aynı gün belirgin biçimde hareket ettiğinde altında birkaç farklı tepki görülebilir.
      items:
        - title: Beklenen yönde
          tone: up
          text: Reel faiz ve dolar **düşer**, altın yükselir. Ters ilişki o gün çalışmıştır.
        - title: Beklenen yönde, ters işaretle
          tone: down
          text: Reel faiz ve dolar **yükselir**, altın düşer. İlişki yine çalışmıştır ama bu kez altın aleyhine.
        - title: İlişki zayıf
          tone: neutral
          text: Reel faiz yükselir ama altın da **yükselir** ya da yatay kalır. Başka bir etken (talep, belirsizlik) o dönemde daha baskın olabilir.
    - type: limits
      shows:
        - Altın tutmanın fırsat maliyetinin yönünü
        - Altın üzerindeki makro baskının ya da desteğin olası kaynağını
        - Altın hareketini yorumlarken bakılabilecek bir bağlamı
      not_proves:
        - Reel faiz ya da dolar hareketinin altını mutlaka ters yöne götüreceğini
        - İlişkinin bir sonraki dönemde de aynı güçte süreceğini
        - Altın fiyatının hangi seviyeye gideceğini
    - type: zones
      paragraphs:
        - >-
          Reel faiz, dolar ya da enflasyon verisindeki sert bir değişim, altın grafiğinde fiyatın bir
          **destek ya da direnç bölgesine** hızla girmesine yol açabilir. Bu hareketin bölgede kabul mü
          gördüğü yoksa geri mi çevrildiği, çoğu zaman verinin kendisinden çok bölgenin etrafındaki
          kapanışlarla okunur.
        - >-
          Veri günlerinde fiyat bir bölgenin içine fitille girip çıkabilir. Bölgeyi tek bir çizgi
          yerine **bir bant** olarak okumak ve 1H yerine 4H ya da günlük kapanışa bakmak, kısa süreli
          sıçramaları kalıcı değişimden ayırmaya yardımcı olur.
    - type: box
      title: Kriptoyla bağlantı
      text: >-
        Reel faiz ve dolar kripto piyasasını da etkileyebilir; ikisi de risk iştahının önemli
        göstergeleridir. Ancak altın ile kripto aynı habere her zaman aynı tepkiyi vermez. İkisinin
        aynı yönde hareket etmesi bir eğilimdir, kural değildir.
  confusions:
    - id: bond-yields
      text: Nominal tahvil getirisi enflasyon beklentisini de içerir; altın açısından daha çok reel getiri (örneğin TIPS getirisi) önemlidir.
    - id: dollar-index
      text: Dolar endeksi doların bir sepet para birimine karşı değerini ölçer; altınla ters ilişkisi eğilimdir, sabit bir oran değildir.
  key_points:
    - Reel faiz ≈ nominal faiz − enflasyon beklentisi; en sık izlenen ölçü 10 yıllık TIPS getirisidir.
    - Altın getiri ödemediği için fırsat maliyeti reel faizle değişir.
    - Altın, reel faiz ve dolarla çoğu zaman ters yönde hareket etme eğilimindedir.
    - Bu ilişki bazı dönemlerde, örneğin güçlü merkez bankası alımlarında, zayıflamıştır.
  svg_labels:
    gold: Altın
    real: Reel faiz (10 yıllık TIPS)
    inverse_1: Çoğu dönemde
    inverse_2: ters yönde
    break_1: İlişkinin
    break_2: zayıfladığı dönem
    time: Zaman
  svg_alt: "Şematik çizim: üstte altın fiyatı, altta reel faiz çizgisi; çizimin büyük kısmında biri yükselirken diğeri düşüyor; sağdaki turuncu gölgeli bölümde ikisi birlikte yükseliyor"
  svg_caption: >-
    Çizim örnek veriyle hazırlanmıştır. Üstteki çizgi altını, alttaki çizgi reel faizi gösterir. Solda
    iki çizgi çoğunlukla ters yönde hareket eder; turuncu gölgeli bölümde ise ikisi birlikte yükselir ve
    ters ilişki zayıflar.

en:
  slug: real-rates-and-the-dollar
  name: Real rates and the dollar
  summary: >-
    Gold pays no interest or dividend. So the cost of holding it depends on the return available
    elsewhere, especially the real rate of interest after inflation. Gold often tends to move against
    real rates and the dollar, but that relationship has clearly weakened in some periods.
  sections:
    - type: text
      id: definition
      title: What is a real rate?
      paragraphs:
        - >-
          A **real rate** is roughly the nominal rate minus expected inflation: real rate ≈ nominal rate −
          inflation expectations. For example, if a bond yields 4% and inflation is expected to be 2.5%,
          the real return is about 1.5% (illustrative numbers).
        - >-
          The measure most watched in markets is the yield on US Treasury inflation-protected
          securities (TIPS). The **10-year TIPS yield** is used as the market's version of the 10-year
          real rate. The difference between the ordinary 10-year Treasury yield and the TIPS yield is
          read as the market's inflation expectation (the breakeven inflation rate).
    - type: text
      id: opportunity-cost
      title: Why is gold sensitive to real rates?
      paragraphs:
        - >-
          Someone holding gold earns no interest. Someone who puts the same money into a bond earns a
          return. That forgone return is the **opportunity cost**. When real rates rise, the opportunity
          cost of holding gold goes up; when real rates fall, especially below zero, that cost shrinks.
        - >-
          What matters here is the real rate, not the nominal one. When inflation is high, a rise in
          nominal rates may not mean the same thing for gold as long as real rates stay low.
    - type: bullets
      id: tendencies
      title: Commonly observed tendencies
      items:
        - text: While real rates are **rising**, gold often comes under pressure; while real rates are **falling**, gold tends to find support.
          marker: neutral
        - text: Gold is priced in dollars on the international market. When the dollar strengthens, gold becomes more expensive for holders of other currencies, so **a strong dollar** often goes together with a weaker gold price.
          marker: neutral
        - text: Real rates and the dollar often move in the same direction; when both rise together, the pressure on gold can be more visible.
          marker: neutral
        - text: These relationships are **tendencies**. They often break down in daily and weekly moves and show more clearly over longer periods.
          marker: accent
    - type: text
      id: when-it-breaks
      title: When the relationship broke
      paragraphs:
        - >-
          The inverse relationship has not always held. In the few years after 2022, real rates rose
          markedly while gold stayed strong instead of weakening. **Strong central-bank gold buying** is
          a frequently cited explanation for that period; geopolitical uncertainty and a wish to
          diversify reserves are also seen as factors.
        - >-
          The picture can also change in sudden crises: the dollar and gold can rise **at the same
          time** on safe-haven demand, or gold can be sold along with everything else when cash is
          needed. So real rates and the dollar are only two of the factors that explain gold.
    - type: scenarios
      id: readings
      title: Different pictures from the same data
      intro: When real rates and the dollar move sharply on the same day, gold can react in several different ways.
      items:
        - title: The expected way
          tone: up
          text: Real rates and the dollar **fall** and gold rises. The inverse relationship worked that day.
        - title: The expected way, the other sign
          tone: down
          text: Real rates and the dollar **rise** and gold falls. The relationship worked again, this time against gold.
        - title: A weak relationship
          tone: neutral
          text: Real rates rise but gold **rises too** or stays flat. Another factor (demand, uncertainty) may be stronger in that period.
    - type: limits
      shows:
        - The direction of the opportunity cost of holding gold
        - A likely source of macro pressure on, or support for, gold
        - Context to look at when reading a gold move
      not_proves:
        - That a move in real rates or the dollar will push gold the other way
        - That the relationship will stay as strong in the next period
        - What level the gold price will reach
    - type: zones
      paragraphs:
        - >-
          A sharp change in real rates, the dollar or inflation data can send the gold price quickly
          into a **support or resistance zone**. Whether the move is accepted at the zone or rejected
          is often read from the closes around the zone more than from the data itself.
        - >-
          On data days, price can wick into a zone and out again. Reading the zone as **a band** rather
          than a single line, and looking at the 4H or daily close rather than the 1H, helps separate a
          brief spike from a lasting change.
    - type: box
      title: The link with crypto
      text: >-
        Real rates and the dollar can affect the crypto market too; both are important gauges of risk
        appetite. But gold and crypto do not always react to the same news in the same way. Moving
        together is a tendency, not a rule.
  confusions:
    - id: bond-yields
      text: A nominal bond yield also contains inflation expectations; for gold the real yield (for example the TIPS yield) matters more.
    - id: dollar-index
      text: The dollar index measures the dollar against a basket of currencies; its inverse link with gold is a tendency, not a fixed ratio.
  key_points:
    - Real rate ≈ nominal rate − inflation expectations; the most watched measure is the 10-year TIPS yield.
    - Gold pays no yield, so its opportunity cost changes with real rates.
    - Gold often tends to move against real rates and the dollar.
    - The relationship has weakened in some periods, for example during strong central-bank buying.
  svg_labels:
    gold: Gold
    real: Real rate (10-year TIPS)
    inverse_1: Mostly moving
    inverse_2: the opposite way
    break_1: Period when the
    break_2: link weakens
    time: Time
  svg_alt: "Schematic drawing: the gold price at the top and a real-rate line at the bottom; for most of the drawing one rises while the other falls; in the orange-shaded part on the right both rise together"
  svg_caption: >-
    The drawing uses example data. The upper line shows gold and the lower line the real rate. On the
    left the two lines mostly move in opposite directions; in the orange-shaded part both rise together
    and the inverse relationship weakens.
