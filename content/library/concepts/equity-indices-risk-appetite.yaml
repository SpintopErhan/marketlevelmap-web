    d7: Sun
  svg_alt: "A schematic one-week chart: at the top a stock index that trades only during US weekday session hours, below it a crypto price that trades without a break for seven days; session hours are marked with grey strips"
  svg_caption: >-
    The grey strips mark the US regular session. The index line moves only during these hours, and
    dashed lines join the closed hours. The crypto line carries on through the weekend; the orange dots
    mark moves around the session open. The data is illustrative.
