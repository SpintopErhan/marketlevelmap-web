tr:
  slug: piyasa-dongusu-ve-duygular
  name: "Piyasa döngüsü ve duygular"
  alt_name: Market cycle psychology
  summary: >-
    Büyük fiyat hareketleri çoğu zaman benzer evrelerden geçer: birikim, yükseliş, dağıtım ve düşüş.
    Her evreye katılımcıların baskın duygusu eşlik eder; inançsızlıktan coşkuya, oradan panik ve
    depresyona. Bu şema, fiyatın büyük resimde hangi evrede olabileceğini düşünmek için bir çerçevedir.
  sections:
    - type: text
      id: definition
      title: Piyasa döngüsü nedir?
      paragraphs:
        - >-
          Fiyat, alıcı ve satıcıların kararlarının sonucudur; kararların arkasında da beklenti, korku ve
          açgözlülük gibi duygular vardır. Bu yüzden büyük yükselişler ve düşüşler çoğu zaman benzer bir
          sırayla ilerler ve her evrede benzer duygular baskın olur.
        - >-
          Sık kullanılan şema, bir yükselişin ve onu izleyen düşüşün duygularını sıralar. Şema her zaman
          aynı biçimde gerçekleşmez; ama kalabalığın davranışını okumak için kullanışlı bir dildir.
    - type: steps
      id: phases
      title: Dört evre
      intro: Evreler piyasa yapısıyla birlikte okunur.
      items:
        - title: Birikim
          text: Düşüşten sonra fiyat bir süre yatay gider. Yeni dip gelmez ya da gelen dipler sweep olarak kalır. İlgi azdır, haberler olumsuzdur.
        - title: Yükseliş
          text: Fiyat aralığın üzerine çıkar ve yükselen tepe ve dipler (HH / HL) art arda gelir. Katılım ve hacim giderek artar.
        - title: Dağıtım
          text: Yükselişin sonunda fiyat yine yatay gider. Yeni tepeler kısa kalır ya da sweep olarak kalır. İlgi ve iyimserlik en yüksek düzeydedir.
        - title: Düşüş
          text: Fiyat aralığın altına iner ve alçalan tepe ve dipler (LH / LL) art arda gelir. Satışlar hızlanır, sonunda yeniden birikim evresine varılır.
    - type: bullets
      id: emotions-up
      title: Yükselişte duygular
      items:
        - text: "**İnançsızlık:** dipten gelen ilk yükselişe güvenilmez; \"önceki toparlanmalar gibi bu da sönecek\" diye düşünülür."
          marker: up
        - text: "**Umut ve iyimserlik:** toparlanmanın mümkün olduğu düşünülmeye başlar."
          marker: up
        - text: "**İnanç ve heyecan:** yükseliş kabul görür; katılım artar, kaldıraç kullanımı yayılır."
          marker: up
        - text: "**Coşku:** herkes kazandığını düşünür; risk en çok bu evrede görmezden gelinir."
          marker: accent
    - type: bullets
      id: emotions-down
      title: Düşüşte duygular
      items:
        - text: "**Kayıtsızlık:** ilk düşüş geçici bir mola olarak görülür."
          marker: down
        - text: "**Kaygı ve inkâr:** düşüş beklenenden uzun sürer, ama yön değişimi kabul edilmez."
          marker: down
        - text: "**Panik ve teslimiyet:** satışlar hızlanır; pozisyonlar ne pahasına olursa olsun kapatılır."
          marker: down
        - text: "**Öfke ve depresyon:** fiyat dipte yatay gider, ilgi kaybolur. Döngü yeniden inançsızlıkla başlar."
          marker: neutral
    - type: text
      id: reading
      title: Şema nasıl okunur?
      paragraphs:
        - >-
          Sık yapılan bir gözlem şudur: coşkunun en yüksek olduğu yer çoğu zaman tepeye, karamsarlığın en
          derin olduğu yer de dibe yakındır. Duygu, fiyatın gittiği yönü değil, kalabalığın ne kadar tek
          tarafa yığıldığını gösterir.
        - >-
          Aynı sıralama farklı ölçeklerde de görülebilir: aylık grafikteki büyük bir döngü de, saatlik
          grafikteki küçük bir dalga da benzer evrelerden geçebilir. Ama küçük ölçekte duygular çok daha
          kısa sürer ve şema daha gevşek işler.
    - type: limits
      shows:
        - Büyük bir hareketin hangi evrelerden geçebileceğine dair bir çerçeve
        - Fiyat hareketine eşlik eden kalabalık davranışını
        - Yatay evrelerin (birikim, dağıtım) trendler arasındaki yerini
      not_proves:
        - O an hangi evrede olunduğunu; evreler çoğu zaman ancak geriye dönüp bakınca nettir
        - Evrelerin ne kadar süreceğini ya da ne kadar büyük olacağını
        - Her döngünün bu sırayı eksiksiz izleyeceğini
    - type: zones
      intro: MarketLevelMap'te döngünün evreleri yapı işaretleriyle izlenebilir.
      points:
        - Price Action görünümündeki **güncel yön** (yükseliş, düşüş, belirsiz) ve BOS etiketleri, yükseliş ve düşüş evrelerindeki art arda kırılımları gösterir.
        - Birikim ve dağıtım evreleri grafikte çoğu zaman **yatay piyasa** olarak görünür. Aynı görünümdeki aralık (RH, EQ, RL) ve **sweep** etiketleri bu evreleri izlemenin bir yoludur.
    - type: box
      title: Kripto piyasasında
      text: >-
        Kripto 7/24 işlem gördüğü ve kaldıraç yaygın olduğu için evreler hızlı ve sert yaşanabilir;
        özellikle panik ve teslimiyet evreleri ani tasfiyelerle birkaç saate sıkışabilir.
  confusions:
    - id: range-and-consolidation
      text: Birikim ve dağıtım birer yatay piyasadır; farkları döngüdeki yerleridir, birikim düşüşten sonra, dağıtım yükselişten sonra gelir.
    - id: trend
      text: Trend fiyatın yönünü anlatır; döngü, trendlerin ve aralarındaki yatay evrelerin büyük ölçekteki sırasını anlatır.
  key_points:
    - Büyük hareketler çoğu zaman birikim, yükseliş, dağıtım ve düşüş evrelerinden geçer.
    - Her evreye baskın bir duygu eşlik eder; coşku tepeye, karamsarlık dibe yakındır.
    - Evreler çoğu zaman ancak geriye dönüp bakınca nettir.
    - Şema bir zamanlama aracı değil, kalabalığı okumak için bir çerçevedir.
  svg_labels:
    disbelief: İnançsızlık
    hope: Umut
    optimism: İyimserlik
    belief: İnanç
    thrill: Heyecan
    euphoria: Coşku
