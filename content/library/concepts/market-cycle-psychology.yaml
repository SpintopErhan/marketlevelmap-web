    ph_markdown: Düşüş
    ph_accumulation2: Birikim
  svg_alt: "Piyasa döngüsü çizimi: fiyat inançsızlık ve umuttan iyimserlik, inanç ve heyecana yükselip coşkuda tepe yapıyor; ardından kayıtsızlık, kaygı, inkâr ve panikle düşüp teslimiyet ve depresyonda dibe iniyor, sonra yeniden inançsızlıkla toparlanıyor. Altta birikim, yükseliş, dağıtım ve düşüş evreleri işaretli"
  svg_caption: Çizgi bir döngüyü, etiketler her noktada baskın duyguyu, alttaki parantezler evreleri gösterir. Gerçek döngüler bu kadar düzenli değildir.

en:
  slug: market-cycle-psychology
  name: "The market cycle and its emotions"
  summary: >-
    Large price moves often go through similar phases: accumulation, markup, distribution and markdown.
    Each phase comes with a dominant emotion among participants; from disbelief to euphoria, and from
    there to panic and depression. This scheme is a framework for thinking about which phase price may be
    in on the big picture.
  sections:
    - type: text
      id: definition
      title: What is the market cycle?
      paragraphs:
        - >-
          Price is the result of buyers' and sellers' decisions, and behind decisions are emotions such
          as expectation, fear and greed. That is why large rises and falls often move in a similar order,
          with similar emotions dominating each phase.
        - >-
          The common scheme lists the emotions of a rise and the fall that follows it. It does not always
          play out the same way, but it is a useful language for reading the crowd's behaviour.
    - type: steps
      id: phases
      title: Four phases
      intro: The phases are read together with market structure.
      items:
        - title: Accumulation
          text: After a decline price moves sideways for a while. No new low comes, or new lows stay as sweeps. Interest is low and the news is negative.
        - title: Markup
          text: Price moves above the range and higher highs and higher lows (HH / HL) follow one another. Participation and volume grow.
        - title: Distribution
          text: At the end of the rise price moves sideways again. New highs stay short or stay as sweeps. Interest and optimism are at their highest.
        - title: Markdown
          text: Price moves below the range and lower highs and lower lows (LH / LL) follow one another. Selling speeds up, and in the end a new accumulation phase is reached.
    - type: bullets
      id: emotions-up
      title: Emotions on the way up
      items:
        - text: "**Disbelief:** the first rise from the bottom is not trusted; \"this will fade like the previous recoveries\"."
          marker: up
        - text: "**Hope and optimism:** a recovery starts to seem possible."
          marker: up
        - text: "**Belief and thrill:** the rise is accepted; participation grows and the use of leverage spreads."
          marker: up
        - text: "**Euphoria:** everyone thinks they are winning; risk is ignored most in this phase."
          marker: accent
    - type: bullets
      id: emotions-down
      title: Emotions on the way down
      items:
        - text: "**Complacency:** the first drop is seen as a temporary pause."
          marker: down
        - text: "**Anxiety and denial:** the drop lasts longer than expected, but the change of direction is not accepted."
          marker: down
        - text: "**Panic and capitulation:** selling speeds up; positions are closed at any price."
          marker: down
        - text: "**Anger and depression:** price moves sideways at the bottom and interest fades. The cycle starts again with disbelief."
          marker: neutral
    - type: text
      id: reading
      title: How is the scheme read?
      paragraphs:
        - >-
          A common observation: the place of highest euphoria is often close to the top, and the place of
          deepest pessimism close to the bottom. Emotion does not show where price is going, but how far
          the crowd is crowded onto one side.
        - >-
          The same order can show up at different scales: a large cycle on the monthly chart and a small
          wave on the hourly chart can go through similar phases. On a small scale, though, emotions last
          much shorter and the scheme works more loosely.
    - type: limits
      shows:
        - A framework for the phases a large move can go through
        - The crowd behaviour that comes with price movement
        - Where the sideways phases (accumulation, distribution) sit between trends
      not_proves:
        - Which phase the market is in right now; phases are often clear only in hindsight
        - How long the phases will last or how large they will be
        - That every cycle will follow this order in full
    - type: zones
      intro: On MarketLevelMap the cycle's phases can be followed with structure marks.
      points:
        - The **current direction** (up, down, undetermined) and the BOS labels in the Price Action view show the consecutive breaks of the markup and markdown phases.
        - Accumulation and distribution often show up on the chart as a **sideways market**. The range (RH, EQ, RL) and the **sweep** labels in the same view are one way to follow these phases.
    - type: box
      title: In crypto
      text: >-
        Because crypto trades 24/7 and leverage is common, the phases can play out fast and hard; the
        panic and capitulation phases in particular can be squeezed into a few hours by sudden
        liquidations.
  confusions:
    - id: range-and-consolidation
      text: Accumulation and distribution are both sideways markets; they differ in their place in the cycle, accumulation after a decline, distribution after a rise.
    - id: trend
      text: A trend describes price's direction; the cycle describes the large-scale order of trends and the sideways phases between them.
  key_points:
    - Large moves often go through accumulation, markup, distribution and markdown.
    - Each phase comes with a dominant emotion; euphoria is close to the top, pessimism close to the bottom.
    - The phases are often clear only in hindsight.
    - The scheme is not a timing tool but a framework for reading the crowd.
  svg_labels:
    disbelief: Disbelief
    hope: Hope
    optimism: Optimism
    belief: Belief
    thrill: Thrill
    euphoria: Euphoria
    complacency: Complacency
    anxiety: Anxiety
    denial: Denial
    panic: Panic
    capitulation: Capitulation
    anger: Anger
    depression: Depression
    disbelief2: Disbelief
    ph_accumulation: Accumulation
    ph_markup: Markup
    ph_distribution: Distribution
    ph_markdown: Markdown
    ph_accumulation2: Accumulation
  svg_alt: "Market cycle drawing: price rises from disbelief and hope through optimism, belief and thrill to a peak at euphoria; then falls through complacency, anxiety, denial and panic to a bottom at capitulation and depression, and recovers again with disbelief. The accumulation, markup, distribution and markdown phases are marked below"
  svg_caption: The line shows one cycle, the labels the dominant emotion at each point, the brackets below the phases. Real cycles are not this regular.
