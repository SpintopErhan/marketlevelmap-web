tr:
  slug: yapi-kirilimi-bos
  name: "BOS: yapı kırılımı"
  alt_name: Break of structure (BOS)
  summary: >-
    BOS, fiyatın trend yönündeki son swing noktasını kapanışla geçmesidir. Yükselişte son swing
    tepesinin, düşüşte son swing dibinin ötesinde gelen kapanış, mevcut yapının sürdüğünü gösterir.
    Fitil yetmez, kırılımı kapanış belirler.
  sections:
    - type: text
      id: definition
      title: BOS nedir?
      paragraphs:
        - >-
          Yükselen bir trend, yükselen tepeler ve yükselen diplerle ilerler. Fiyat son **swing
          tepesinin** üzerinde kapanış yaptığında yeni bir yükselen tepeye giden yol açılmış olur. Bu
          kapanışa **yapı kırılımı (BOS, break of structure)** denir.
        - >-
          Düşen trendde aynı şey ters yönde geçerlidir: son **swing dibinin** altında gelen kapanış,
          düşen yapının sürdüğünü gösterir. BOS bu yüzden bir dönüş değil, **devam** işaretidir.
      note: BOS ve CHoCH kısaltmaları "Smart Money Concepts" (SMC) olarak bilinen yaklaşımdan gelir. Bu sayfa terimleri yalnızca ölçülebilir bir yapı tanımı olarak kullanır.
    - type: steps
      id: how-it-forms
      title: Nasıl oluşur?
      items:
        - title: Bir swing tepesi oluşur.
          text: Fiyat bir tepe yapar ve geri çekilir. Tepe, sağında birkaç mum daha düşük kaldıktan sonra **swing tepesi** olarak bilinir hale gelir.
        - title: Geri çekilme bir dip bırakır.
          text: Geri çekilmenin en düşük noktası, yükselişin dayandığı yeni dip olur.
        - title: Kapanış swing tepesinin üzerinde gelir.
          text: Fiyat yeniden yükselir ve bir mum, swing tepesinin **üzerinde kapanır**. Bu kapanış BOS'tur.
        - title: Korunan seviye belirlenir.
          text: Swing tepesi ile BOS mumu arasındaki en düşük dip, artık yükselen yapının **korunan dibidir**. Yapının bozulup bozulmadığı bu dibe bakılarak ölçülür.
    - type: scenarios
      id: three-outcomes
      title: Swing tepesinde üç farklı sonuç
      intro: Fiyat son swing tepesine geldiğinde üç farklı tablo oluşabilir. Farkı kapanış belirler.
      items:
        - title: BOS
          tone: up
          text: Mum swing tepesinin **belirgin şekilde üzerinde kapanır**. Yükselen yapı sürer, yeni bir korunan dip oluşur.
        - title: Fitille aşım
          tone: neutral
          text: Fitil tepenin üzerine çıkar ama kapanış **altında kalır**. Bu BOS değildir; çoğu zaman tepenin denendiğini gösterir.
        - title: Tepeye ulaşamama
          tone: down
          text: Fiyat tepeye ulaşamadan geri döner ve **alçalan bir tepe** bırakır. Yapı zayıflayabilir, ama kırılmış değildir.
    - type: bullets
      id: rules
      title: BOS'u ölçmek için
      items:
        - text: Kırılımı **kapanış** belirler. Swing tepesini yalnızca fitille geçen mum BOS sayılmaz.
          marker: accent
        - text: Kapanışın seviyeyi **küçük bir payla** geçmesi beklenir. Seviyenin tam üzerinde gelen bir kapanış olağan oynaklığın içinde kalabilir.
          marker: neutral
        - text: Bir swing yalnız **bir kez** kırılır. Bir sonraki BOS için daha yeni bir swing tepesinin oluşması gerekir.
          marker: neutral
        - text: Swing noktası ancak sağındaki mumlar kapandıktan sonra bilinir. Henüz oluşmakta olan bir tepe kırılamaz.
          marker: neutral
    - type: limits
      shows:
        - Trend yönündeki son swing noktasının kapanışla geçildiğini
        - Mevcut yapının sürdüğünü ve yeni korunan seviyenin nerede olduğunu
        - Yapıyı fitil yerine kapanışla ölçmenin bir yolunu
      not_proves:
        - Fiyatın kırılım yönünde ilerlemeye devam edeceğini
        - Kırılımın bir sonraki mumda geri alınmayacağını
        - Bir zaman dilimindeki BOS'un diğer zaman dilimlerinde de geçerli olduğunu
    - type: zones
      intro: MarketLevelMap'in Price Action görünümünde BOS şu kurallarla işaretlenir.
      points:
        - Yalnızca **kapanmış mumlar** kullanılır; oluşmakta olan mum hesaba girmez.
        - Swing noktası, solundaki ve sağındaki belirli sayıda mumdan daha uç olduğunda oluşur ve **sağındaki mumlar kapandıktan sonra** kırılabilir.
        - Kapanışın swing'i geçme payı **ATR cinsinden** ölçülür; böylece eşik, o anki oynaklığa göre ayarlanır.
        - Yön henüz belirsizse, hangi taraf önce kapanışla kırılırsa yönü o belirler.
        - Grafikte kırılan swing'in mumundan kırılım mumuna uzanan kısa bir çizgi ve **BOS ↑** / **BOS ↓** etiketiyle gösterilir. Korunan seviye grafikte çizilmez; "Yapı" tablosunda güncel yön ve korunan seviye yazılır.
    - type: box
      title: Zaman dilimi farkı
      text: >-
        1H grafikteki bir BOS, 4H ya da günlük grafikte henüz bir swing'in içinde kalan küçük bir
        hareket olabilir. Bir BOS'tan söz ederken hangi zaman diliminde oluştuğunu belirtmek, yorumu
        netleştirir.
  confusions:
    - id: change-of-character
      text: BOS yapının sürdüğünü, CHoCH korunan seviyenin kırılıp yapının döndüğünü gösterir.
    - id: false-breakout
      text: Swing tepesini fitille geçip altında kapanan bir mum BOS değil, çoğu zaman sahte kırılımdır.
  key_points:
    - BOS, trend yönündeki son swing'in kapanışla geçilmesidir.
    - Fitil yetmez; kapanış seviyenin belirgin şekilde ötesinde olmalıdır.
    - BOS dönüş değil, devam işaretidir.
    - Her BOS yeni bir korunan seviye kurar.
  svg_labels:
    bos: BOS ↑
    swing_1: Son swing
    swing_2: tepesi
    protected_1: Korunan dip
    protected_2: (son BOS'tan sonra)
    close_1: Kapanış tepenin
    close_2: üzerinde
  svg_alt: "Yapı kırılımı çizimi: yükselen fiyat iki kez son swing tepesinin üzerinde kapanıyor, her kırılım BOS olarak işaretleniyor; son kırılımdan önceki dip turuncu bir bantla korunan dip olarak gösteriliyor"
  svg_caption: Kesikli gri çizgiler kırılan swing tepelerini, turuncu noktalar kırılımı yapan kapanışları gösterir. Turuncu bant, son BOS'tan sonra yükselen yapının korunan dibidir.

en:
  slug: break-of-structure-bos
  name: "BOS: break of structure"
  summary: >-
    A BOS is when price closes beyond the last swing point in the direction of the trend. In an
    uptrend a close above the last swing high, in a downtrend a close below the last swing low, shows
    that the current structure continues. A wick is not enough; the close decides.
  sections:
    - type: text
      id: definition
      title: What is a BOS?
      paragraphs:
        - >-
          An uptrend moves on with higher highs and higher lows. When price closes above the last
          **swing high**, the way to a new higher high is open. That close is called a **break of
          structure (BOS)**.
        - >-
          The same holds the other way round in a downtrend: a close below the last **swing low**
          shows that the falling structure continues. A BOS is therefore a sign of **continuation**,
          not reversal.
      note: The abbreviations BOS and CHoCH come from the approach known as "Smart Money Concepts" (SMC). This page uses the terms only as a measurable definition of structure.
    - type: steps
      id: how-it-forms
      title: How it forms
      items:
        - title: A swing high forms.
          text: Price makes a high and pulls back. Once a few candles to its right have stayed lower, the high becomes known as a **swing high**.
        - title: The pullback leaves a low.
          text: The lowest point of the pullback becomes the new low the rise rests on.
        - title: A close comes above the swing high.
          text: Price rises again and a candle **closes above** the swing high. That close is the BOS.
        - title: The protected level is set.
          text: The lowest low between the swing high and the BOS candle is now the **protected low** of the rising structure. Whether the structure breaks is measured against this low.
    - type: scenarios
      id: three-outcomes
      title: Three outcomes at the swing high
      intro: When price reaches the last swing high, three different pictures can follow. The close makes the difference.
      items:
        - title: BOS
          tone: up
          text: The candle **closes clearly above** the swing high. The rising structure continues and a new protected low forms.
        - title: Wick through
          tone: neutral
          text: The wick goes above the high but the close **stays below** it. This is not a BOS; it often shows the high being tested.
        - title: Falls short
          tone: down
          text: Price turns back before reaching the high and leaves a **lower high**. The structure may be weakening, but it is not broken.
    - type: bullets
      id: rules
      title: Measuring a BOS
      items:
        - text: The **close** decides the break. A candle that only wicks through the swing high is not a BOS.
          marker: accent
        - text: The close is expected to clear the level by **a small margin**. A close just above the level can stay within the usual variability.
          marker: neutral
        - text: A swing breaks only **once**. The next BOS needs a newer swing high to form.
          marker: neutral
        - text: A swing point is only known once the candles to its right have closed. A high that is still forming cannot be broken.
          marker: neutral
    - type: limits
      shows:
        - That the last swing point in the trend's direction was cleared by a close
        - That the current structure continues, and where the new protected level is
        - A way to measure structure by the close rather than the wick
      not_proves:
        - That price will keep moving in the direction of the break
        - That the break will not be reversed in the next candle
        - That a BOS on one timeframe holds on other timeframes
    - type: zones
      intro: In MarketLevelMap's Price Action view a BOS is marked by these rules.
      points:
        - Only **closed candles** are used; the candle still forming does not count.
        - A swing point forms when it is more extreme than a set number of candles on each side, and can be broken only **after the candles to its right have closed**.
        - The margin by which the close must clear the swing is measured **in ATR**, so the threshold adapts to current volatility.
        - While the direction is still undetermined, whichever side is broken by a close first sets the direction.
        - On the chart it shows as a short line from the broken swing's candle to the break candle, labelled **BOS ↑** / **BOS ↓**. The protected level is not drawn; the "Structure" table shows the current direction and the protected level.
    - type: box
      title: The timeframe matters
      text: >-
        A BOS on the 1H chart can be a small move still inside a swing on the 4H or daily chart.
        Saying which timeframe a BOS formed on makes the reading clearer.
  confusions:
    - id: change-of-character
      text: A BOS shows the structure continuing; a CHoCH shows the protected level breaking and the structure turning.
    - id: false-breakout
      text: A candle that wicks above the swing high and closes below it is not a BOS but often a false breakout.
  key_points:
    - A BOS is a close beyond the last swing in the trend's direction.
    - A wick is not enough; the close must be clearly beyond the level.
    - A BOS signals continuation, not reversal.
    - Every BOS sets a new protected level.
  svg_labels:
    bos: BOS ↑
    swing_1: Last swing
    swing_2: high
    protected_1: Protected low
    protected_2: (after the last BOS)
    close_1: Close above
    close_2: the high
  svg_alt: "Break of structure illustration: rising price closes above the last swing high twice, each break marked BOS; the low before the latest break is shown as the protected low with an orange band"
  svg_caption: The dashed grey lines mark the swing highs that were broken and the orange dots the closes that broke them. The orange band is the protected low of the rising structure after the latest BOS.
