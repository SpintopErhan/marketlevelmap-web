tr:
  slug: fed-faiz-kararlari
  name: Fed faiz kararları (FOMC)
  alt_name: Fed rate decisions (FOMC)
  summary: >-
    ABD Merkez Bankası Fed'in politika faizini, Federal Açık Piyasa Komitesi (FOMC) yılda sekiz planlı
    toplantıda belirler. Karar 14:00 ET'de açıklanır, 14:30 ET'de basın toplantısı yapılır. Piyasalar
    kararın yanında metni, projeksiyonları ve sonraki adımlara dair işaretleri beklentiyle karşılaştırır.
  sections:
    - type: text
      id: definition
      title: FOMC nedir, neye karar verir?
      paragraphs:
        - >-
          **FOMC** (Federal Open Market Committee), Fed'in para politikasını belirleyen komitedir. Oy
          hakkı olan 12 üyesi vardır: Fed Yönetim Kurulu'nun yedi üyesi, New York Fed başkanı ve diğer
          on bir bölgesel Fed başkanından dönüşümlü olarak dördü. Komite, Fed Başkanı'nın başkanlığında
          toplanır.
        - >-
          Komitenin en çok izlenen kararı **federal fon oranı** için belirlediği hedef aralıktır. Bu,
          bankaların birbirine gecelik borç verdiği faizin hedeflendiği çeyrek puan genişliğinde bir
          aralıktır. Değişiklikler çoğunlukla 0,25 puanlık adımlarla yapılır; daha büyük adımlar da
          görülmüştür. Komite bunun yanında Fed bilançosuna ilişkin kararlar da alır.
    - type: steps
      id: decision-day
      title: Takvim ve karar günü
      items:
        - title: Yılda sekiz planlı toplantı
          text: Toplantılar yaklaşık altı haftada bir yapılır ve çoğu iki gün sürer. Tarihler bir yıl önceden açıklanır; gerektiğinde plan dışı toplantı da yapılabilir.
        - title: "14:00 ET: karar metni"
          text: Kararın ve gerekçesinin yer aldığı metin toplantının son günü açıklanır. Bu saat yaz saatinde 18:00 UTC'ye, kış saatinde 19:00 UTC'ye denk gelir.
        - title: "14:30 ET: basın toplantısı"
          text: Fed Başkanı kararı anlatır ve soruları yanıtlar. Piyasalar burada sonraki adımlara dair ipuçları arar; tepki karar metninden sonra ikinci bir dalga olarak gelebilir.
        - title: Mart, haziran, eylül ve aralık toplantıları
          text: Bu dört toplantıda **Ekonomik Projeksiyonlar Özeti** (SEP) de yayımlanır. İçindeki **nokta grafiği** (dot plot), her katılımcının önümüzdeki yıllar için uygun gördüğü faiz düzeyini bir nokta olarak gösterir.
        - title: Üç hafta sonra tutanaklar
          text: Toplantı **tutanakları** (minutes) karardan üç hafta sonra, yine 14:00 ET'de yayımlanır. Komite içindeki görüş farklılıklarını daha ayrıntılı gösterir.
    - type: text
      id: market-expectations
      title: Piyasanın beklentisi nasıl izlenir?
      paragraphs:
        - >-
          Federal fon oranına bağlı **vadeli işlemlerin** fiyatları, piyasanın gelecekteki faiz düzeyi
          hakkında ne beklediğini ima eder. Bu fiyatlardan hesaplanan **olasılık araçları**, bir sonraki
          toplantıda faizin değişmemesine, indirilmesine ya da artırılmasına piyasanın ne olasılık
          verdiğini gösterir.
        - >-
          Bu olasılıklar bir tahmin değil, o anki fiyatlamanın bir özetidir. Yeni verilerle ve
          yetkililerin açıklamalarıyla günden güne değişebilir. Karar gününe gelindiğinde olasılık
          yüzde yüze yakınsa, kararın kendisi büyük ölçüde fiyatlanmış olabilir; o zaman dikkat metne,
          projeksiyonlara ve basın toplantısına kayar.
    - type: bullets
      id: what-markets-watch
      title: Karar gününde neye bakılır?
      items:
        - text: "**Karar ve beklenti:** faiz kararının, piyasanın ima ettiği olasılıkla karşılaştırılması."
          marker: neutral
        - text: "**Metindeki değişiklikler:** bir önceki karar metnine göre eklenen ya da çıkarılan ifadeler."
          marker: neutral
        - text: "**Nokta grafiği:** projeksiyon toplantılarında, katılımcıların faiz yolu beklentisinin önceki projeksiyona göre nasıl değiştiği."
          marker: accent
        - text: "**Basın toplantısı:** sonraki adımlara dair verilen işaretler. Daha **güvercin** (gevşemeye yatkın) ya da daha **şahin** (sıkılaştırmaya yatkın) bir ton olarak okunabilir."
          marker: neutral
        - text: "**Karşı oylar:** kararın oy birliğiyle mi alındığı, karşı oy verenlerin hangi yönde ayrıştığı."
          marker: neutral
      note: >-
        Faiz beklentileri dolar ve tahvil faizleri üzerinden risk iştahını etkileyebildiği için kripto
        da Fed kararlarına sık tepki verir. Bu bir eğilimdir; tepkinin yönü ve büyüklüğü dönemden döneme
        değişir.
    - type: limits
      shows:
        - Fed'in politika faizini ve bundan sonraki adımlara bakışını
        - Kararın ve yönlendirmenin piyasanın beklentisinden ne kadar saptığını
        - Volatilitenin hangi saatlerde artabileceğini (karar metni ve basın toplantısı)
      not_proves:
        - Kripto ya da başka bir varlığın karardan sonra hangi yöne gideceğini
        - Nokta grafiğindeki faiz yolunun gerçekleşeceğini; projeksiyonlar verilere göre değişir
        - İlk tepkinin kalıcı olacağını; basın toplantısı ilk hareketi değiştirebilir
    - type: zones
      paragraphs:
        - >-
          Karar günü fiyat birkaç dakika içinde iki yöne de hareket edebilir: önce karar metnine, yarım
          saat sonra basın toplantısına tepki verir. Bu sırada bir destek ya da direnç bölgesinin
          ötesine atılan fitiller sık görülür. Bölgeyi **bir bant** olarak okumak ve kırılımı
          toplantıdan sonraki 1H ya da 4H **mum kapanışıyla** değerlendirmek, bu dalgalanmaları
          kırılımdan ayırmaya yardımcı olur.
        - >-
          Fiyatın karar gününe yakın olduğu bölgeler, tepkinin nerede yavaşlayabileceğine dair bir
          referans verir. Karar gününden sonra bölgenin korunup korunmadığı, olayın grafiğe nasıl
          yansıdığını gösterir.
  confusions:
    - id: priced-in
      text: Kararın kendisi çoğu zaman önceden fiyatlanmıştır; tepkiyi genellikle beklenmeyen kısım, yani metin, projeksiyonlar ve basın toplantısı belirler.
    - id: bond-yields
      text: Tahvil faizlerini piyasa belirler, federal fon oranını ise Fed; iki faiz ilişkilidir ama aynı şey değildir.
  key_points:
    - FOMC yılda sekiz planlı toplantıda federal fon oranı için hedef aralığı belirler.
    - Karar 14:00 ET'de, basın toplantısı 14:30 ET'de; yaz saatine göre 18:00 ya da 19:00 UTC.
    - Nokta grafiği mart, haziran, eylül ve aralık toplantılarında yayımlanır; tutanaklar üç hafta sonra gelir.
    - Tepkiyi çoğu zaman kararın beklentiden ve önceki yönlendirmeden sapan kısmı belirler.
  svg_labels:
    year: Yılda sekiz planlı toplantı (tarihler her yıl değişir)
    m1: Oca
    m2: Şub
    m3: Mar
    m4: Nis
    m5: May
    m6: Haz
    m7: Tem
    m8: Ağu
